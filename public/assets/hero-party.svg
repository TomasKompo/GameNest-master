<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrace párty her">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26302a"/>
      <stop offset="0.5" stop-color="#20201a"/>
      <stop offset="1" stop-color="#161510"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8bf7c" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e8bf7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fb3a1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#5fb3a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPlum" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a6ea8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9a6ea8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e3"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e88a6d"/>
      <stop offset="1" stop-color="#c95f47"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67c0ac"/>
      <stop offset="1" stop-color="#3d8d7c"/>
    </linearGradient>
    <linearGradient id="dieA" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#ddcfae"/>
    </linearGradient>
    <linearGradient id="dieB" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e3b873"/>
      <stop offset="1" stop-color="#bd8c44"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101210" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#101210" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#101210" stop-opacity="0.42"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>

    <g id="meeple">
      <circle cx="0" cy="-30" r="12"/>
      <path d="M-9,-22 L-9,-14 L-28,-6 L-21,5 L-9,1 L-9,18 L-15,30 L15,30 L9,18 L9,1 L21,5 L28,-6 L9,-14 L9,-22 Z"/>
    </g>
    <g id="pip">
      <circle r="7.5"/>
    </g>
    <path id="heart" d="M0,13 C-15,3 -19,-8 -10.5,-13 C-4.5,-16.5 0,-11 0,-6.5 C0,-11 4.5,-16.5 10.5,-13 C19,-8 15,3 0,13 Z"/>
    <path id="spade" d="M0,-15 C-7,-7 -16,-3 -16,4 C-16,10 -8,12 0,6 C8,12 16,10 16,4 C16,-3 7,-7 0,-15 Z M-5,7 L5,7 L8,17 L-8,17 Z"/>
    <path id="diamond" d="M0,-15 L11,0 L0,15 L-11,0 Z"/>
    <g id="club">
      <circle cx="0" cy="-8" r="7.5"/>
      <circle cx="-8" cy="3" r="7.5"/>
      <circle cx="8" cy="3" r="7.5"/>
      <path d="M-4,7 L4,7 L7,18 L-7,18 Z"/>
    </g>
  </defs>

  <!-- base -->
  <rect width="1600" height="860" fill="url(#bg)"/>
  <ellipse cx="1220" cy="250" rx="620" ry="460" fill="url(#glowGold)"/>
  <ellipse cx="330" cy="740" rx="560" ry="380" fill="url(#glowTeal)"/>
  <ellipse cx="700" cy="80" rx="420" ry="300" fill="url(#glowPlum)"/>

  <!-- faint concentric rings -->
  <g fill="none" stroke="#f6ecd8" stroke-opacity="0.07" stroke-width="1.5">
    <circle cx="1180" cy="430" r="300"/>
    <circle cx="1180" cy="430" r="390"/>
    <circle cx="1180" cy="430" r="480"/>
  </g>

  <!-- soft light beam -->
  <path d="M1600,-40 L1600,120 L520,860 L200,860 Z" fill="#f6ecd8" fill-opacity="0.045"/>

  <!-- large outlined card drifting in the background -->
  <g transform="translate(520 250) rotate(-18)" opacity="0.55">
    <rect x="-120" y="-170" width="240" height="340" rx="26" fill="#f6ecd8" fill-opacity="0.05" stroke="#f6ecd8" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="-100" y="-150" width="200" height="300" rx="18" fill="none" stroke="#f6ecd8" stroke-opacity="0.1" stroke-width="1.5"/>
    <use href="#heart" fill="#f6ecd8" fill-opacity="0.14" transform="scale(2.4)"/>
  </g>

  <!-- winding game track -->
  <path d="M170,760 C420,690 470,560 700,570 C930,580 940,700 1180,690 C1350,683 1440,610 1540,560"
        fill="none" stroke="#e3b873" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 20"/>
  <g fill="#e3b873" fill-opacity="0.35">
    <circle cx="470" cy="628" r="6"/>
    <circle cx="700" cy="572" r="6"/>
    <circle cx="930" cy="678" r="6"/>
    <circle cx="1180" cy="690" r="6"/>
    <circle cx="1400" cy="632" r="6"/>
  </g>

  <!-- spotlight behind the table props -->
  <ellipse cx="1040" cy="480" rx="380" ry="340" fill="url(#glowGold)" opacity="0.85"/>

  <!-- playing cards fan -->
  <g transform="translate(1010 470) rotate(-8)">
    <g transform="rotate(-24)">
      <rect x="-78" y="-118" width="156" height="222" rx="18" fill="url(#cardC)" stroke="#f6ecd8" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="-64" y="-104" width="128" height="194" rx="12" fill="none" stroke="#0f1410" stroke-opacity="0.22" stroke-width="2"/>
      <use href="#diamond" x="0" y="-6" fill="#0f1410" fill-opacity="0.55" transform="translate(0 -6) scale(1.5) translate(0 6)"/>
    </g>
    <g transform="rotate(-2)">
      <rect x="-78" y="-118" width="156" height="222" rx="18" fill="url(#cardA)" stroke="#0f1410" stroke-opacity="0.18" stroke-width="2"/>
      <rect x="-64" y="-104" width="128" height="194" rx="12" fill="none" stroke="#b9954f" stroke-opacity="0.55" stroke-width="2"/>
      <use href="#heart" fill="#c95f47" transform="translate(0 -8) scale(1.6)"/>
      <use href="#heart" fill="#c95f47" transform="translate(0 54) scale(0.7) rotate(180)"/>
      <circle cx="-50" cy="-88" r="6" fill="#b9954f" fill-opacity="0.75"/>
      <circle cx="50" cy="88" r="6" fill="#b9954f" fill-opacity="0.75"/>
    </g>
    <g transform="rotate(20)">
      <rect x="-78" y="-118" width="156" height="222" rx="18" fill="url(#cardB)" stroke="#f6ecd8" stroke-opacity="0.3" stroke-width="2"/>
      <rect x="-64" y="-104" width="128" height="194" rx="12" fill="none" stroke="#f6ecd8" stroke-opacity="0.28" stroke-width="2"/>
      <use href="#spade" fill="#fdf6e6" fill-opacity="0.9" transform="translate(0 -6) scale(1.5)"/>
      <circle cx="-50" cy="-88" r="6" fill="#fdf6e6" fill-opacity="0.7"/>
      <circle cx="50" cy="88" r="6" fill="#fdf6e6" fill-opacity="0.7"/>
    </g>
  </g>

  <!-- dice -->
  <g transform="translate(1330 268) rotate(14)">
    <rect x="-72" y="-72" width="144" height="144" rx="30" fill="url(#dieA)" stroke="#0f1410" stroke-opacity="0.16" stroke-width="2"/>
    <g fill="#2b2721">
      <use href="#pip" x="-38" y="-38"/>
      <use href="#pip" x="38" y="-38"/>
      <use href="#pip" x="0" y="0"/>
      <use href="#pip" x="-38" y="38"/>
      <use href="#pip" x="38" y="38"/>
    </g>
  </g>
  <g transform="translate(1210 690) rotate(-16)">
    <rect x="-60" y="-60" width="120" height="120" rx="26" fill="url(#dieB)" stroke="#0f1410" stroke-opacity="0.18" stroke-width="2"/>
    <g fill="#2b2721" fill-opacity="0.85">
      <use href="#pip" x="-30" y="-30" transform="translate(0 0)"/>
      <use href="#pip" x="30" y="0"/>
      <use href="#pip" x="-30" y="30"/>
    </g>
  </g>

  <!-- meeples -->
  <g fill="#e3b873" transform="translate(880 640) scale(1.15) rotate(-8)">
    <use href="#meeple"/>
  </g>
  <g fill="#67c0ac" transform="translate(952 672) scale(1.35) rotate(6)">
    <use href="#meeple"/>
  </g>
  <g fill="#e28a6d" transform="translate(1035 700) scale(1.05) rotate(-4)">
    <use href="#meeple"/>
  </g>

  <!-- chips -->
  <g transform="translate(1440 560)">
    <circle r="52" fill="#20302b" stroke="#e3b873" stroke-opacity="0.55" stroke-width="3"/>
    <circle r="38" fill="none" stroke="#e3b873" stroke-opacity="0.45" stroke-width="6" stroke-dasharray="12 10"/>
    <circle r="14" fill="#e3b873" fill-opacity="0.8"/>
  </g>

  <!-- confetti -->
  <g fill="#e3b873">
    <circle cx="640" cy="150" r="9" opacity="0.4"/>
    <circle cx="1470" cy="140" r="7" opacity="0.35"/>
    <circle cx="820" cy="230" r="5" opacity="0.3"/>
    <circle cx="1520" cy="740" r="11" opacity="0.25"/>
    <circle cx="1180" cy="90" r="6" opacity="0.3"/>
    <rect x="380" y="330" width="16" height="16" rx="4" opacity="0.28" transform="rotate(18 388 338)"/>
    <rect x="1300" y="430" width="13" height="13" rx="3" opacity="0.3" transform="rotate(-24 1306 436)"/>
    <rect x="700" y="430" width="11" height="11" rx="3" opacity="0.22" transform="rotate(10 705 435)"/>
  </g>
  <g fill="#67c0ac" opacity="0.45">
    <circle cx="900" cy="140" r="6"/>
    <circle cx="1560" cy="300" r="8"/>
    <circle cx="560" cy="250" r="5"/>
    <circle cx="1260" cy="790" r="6"/>
  </g>
  <g fill="#e28a6d" opacity="0.5">
    <circle cx="1080" cy="180" r="5"/>
    <circle cx="470" cy="470" r="7"/>
    <circle cx="1470" cy="200" r="4"/>
    <circle cx="860" cy="480" r="5"/>
  </g>

  <!-- sparkles -->
  <g stroke="#f6ecd8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M760 300 v26 M747 313 h26"/>
    <path d="M1490 470 v20 M1480 480 h20"/>
    <path d="M610 640 v18 M601 649 h18"/>
  </g>

  <!-- left-to-right shading keeps text legible -->
  <rect width="1600" height="860" fill="url(#vignette)"/>
  <rect width="1600" height="860" fill="url(#grain)"/>
</svg>
