<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrace párty her">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#232d27"/>
      <stop offset="0.55" stop-color="#1d1d17"/>
      <stop offset="1" stop-color="#141310"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8bf7c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e8bf7c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e3"/>
      <stop offset="1" stop-color="#e9dcc0"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e88a6d"/>
      <stop offset="1" stop-color="#c95f47"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67c0ac"/>
      <stop offset="1" stop-color="#3d8d7c"/>
    </linearGradient>
    <linearGradient id="dieA" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fdf7ea"/>
      <stop offset="1" stop-color="#ddcfae"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101210" stop-opacity="0.6"/>
      <stop offset="0.38" stop-color="#101210" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#101210" stop-opacity="0.35"/>
    </linearGradient>
    <g id="meeple">
      <circle cx="0" cy="-22" r="9"/>
      <path d="M-7,-16 L-7,-10 L-21,-4 L-16,4 L-7,1 L-7,13 L-11,22 L11,22 L7,13 L7,1 L16,4 L21,-4 L7,-10 L7,-16 Z"/>
    </g>
    <g id="pip"><circle r="5"/></g>
    <path id="heart" d="M0,10 C-11,2 -14,-6 -8,-10 C-3.5,-12.5 0,-8 0,-5 C0,-8 3.5,-12.5 8,-10 C14,-6 11,2 0,10 Z"/>
    <path id="spade" d="M0,-11 C-5,-5 -12,-2 -12,3 C-12,8 -6,9 0,4.5 C6,9 12,8 12,3 C12,-2 5,-5 0,-11 Z M-4,5 L4,5 L6,13 L-6,13 Z"/>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>
  <ellipse cx="900" cy="130" rx="420" ry="190" fill="url(#glowGold)"/>
  <path d="M1200,-30 L1200,20 L520,240 L300,240 Z" fill="#f6ecd8" fill-opacity="0.05"/>

  <g fill="none" stroke="#f6ecd8" stroke-opacity="0.08" stroke-width="1.4">
    <circle cx="900" cy="120" r="120"/>
    <circle cx="900" cy="120" r="165"/>
  </g>

  <!-- cards -->
  <g transform="translate(830 130) rotate(-8)">
    <g transform="rotate(-22)">
      <rect x="-52" y="-78" width="104" height="148" rx="13" fill="url(#cardC)" stroke="#f6ecd8" stroke-opacity="0.3" stroke-width="1.6"/>
      <use href="#spade" fill="#0f1410" fill-opacity="0.45" transform="scale(1.3)"/>
    </g>
    <g transform="rotate(2)">
      <rect x="-52" y="-78" width="104" height="148" rx="13" fill="url(#cardA)" stroke="#b9954f" stroke-opacity="0.5" stroke-width="1.6"/>
      <use href="#heart" fill="#c95f47" transform="scale(1.9)"/>
    </g>
    <g transform="rotate(22)">
      <rect x="-52" y="-78" width="104" height="148" rx="13" fill="url(#cardB)" stroke="#f6ecd8" stroke-opacity="0.28" stroke-width="1.6"/>
      <use href="#spade" fill="#fdf6e6" fill-opacity="0.9" transform="scale(1.6)"/>
    </g>
  </g>

  <!-- die -->
  <g transform="translate(1000 92) rotate(14)">
    <rect x="-44" y="-44" width="88" height="88" rx="20" fill="url(#dieA)" stroke="#0f1410" stroke-opacity="0.16" stroke-width="1.6"/>
    <g fill="#2b2721">
      <use href="#pip" x="-22" y="-22"/>
      <use href="#pip" x="22" y="-22"/>
      <use href="#pip" x="0" y="0"/>
      <use href="#pip" x="-22" y="22"/>
      <use href="#pip" x="22" y="22"/>
    </g>
  </g>

  <!-- meeples -->
  <g fill="#67c0ac" transform="translate(690 186) scale(0.95)">
    <use href="#meeple"/>
  </g>
  <g fill="#e3b873" transform="translate(742 196) scale(1.1)">
    <use href="#meeple"/>
  </g>

  <!-- confetti -->
  <g fill="#e3b873" opacity="0.4">
    <circle cx="530" cy="58" r="5"/>
    <circle cx="1120" cy="176" r="6"/>
    <circle cx="940" cy="212" r="4"/>
    <rect x="600" y="150" width="9" height="9" rx="2" transform="rotate(18 604 154)"/>
  </g>
  <g fill="#67c0ac" opacity="0.45">
    <circle cx="1160" cy="52" r="5"/>
    <circle cx="640" cy="66" r="4"/>
  </g>
  <g stroke="#f6ecd8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M580 110 v16 M572 118 h16"/>
  </g>

  <rect width="1200" height="240" fill="url(#vignette)"/>
</svg>
